import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

ext {
    groupName='com.incquerylabs'
    rootProjectName='v4md'
    pluginProjectName='v4md'
    mdPluginProjectName=String.join('.', groupName, pluginProjectName)
    mdIntegrationTestProjectName=String.join('.', groupName, pluginProjectName, 'integrationtest')
    buildTimestamp=DateTimeFormatter.ofPattern("yyyy-MM-dd-HH:mm").format(LocalDateTime.now())
}
